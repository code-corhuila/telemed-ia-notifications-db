databaseChangeLog:
  - changeSet:
      id: ddl-alter-001
      author: telemed
      labels: "HU-03,ddl,alter"
      comment: "Store X-Correlation-Id values of up to 128 characters, aligned with notifications-api and the identity outbox."
      changes:
        - sqlFile:
            path: 001_widen_notification_correlation_id.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/01_ddl/04_alter/001_widen_notification_correlation_id.rollback.sql
            relativeToChangelogFile: true
            splitStatements: false
  - changeSet:
      id: ddl-alter-002
      author: telemed
      labels: "HU-17,HU-18,ddl,alter"
      comment: "Inbox fields: idempotency per event and recipient, DOCUMENT_READY type and the subject of each notification."
      changes:
        - sqlFile:
            path: 002_add_notification_inbox_fields.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/01_ddl/04_alter/002_add_notification_inbox_fields.rollback.sql
            relativeToChangelogFile: true
            splitStatements: false
  - changeSet:
      id: ddl-alter-003
      author: telemed
      labels: "HU-17,HU-18,ddl,alter"
      comment: "IN_APP channel for notifications shown only in the inbox (professionals, consultation PDF ready)."
      changes:
        - sqlFile:
            path: 003_add_notification_in_app_channel.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/01_ddl/04_alter/003_add_notification_in_app_channel.rollback.sql
            relativeToChangelogFile: true
            splitStatements: false
